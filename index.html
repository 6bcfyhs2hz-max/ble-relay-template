<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>中继</title>
<style>
  :root {
    --bg: #EEE8F3;
    --panel: #FBF9FC;
    --ink: #2B1D33;
    --muted: #7A6A85;
    --line: #D9CFE1;
    --accent: #6B4E8A;
    --ok: #2F7D5B;
    --stop: #B3122B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1522; --panel: #261D2E; --ink: #EDE6F2; --muted: #A596B0;
      --line: #3B2F45; --accent: #B79BD6; --ok: #5CC395; --stop: #E0344F;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    font-size: 16px; line-height: 1.5;
    padding: 16px 16px 132px;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 12px; font-weight: 700; }
  .status { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 8px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=url] {
    width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > * { flex: 1; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--panel); }
  button:disabled { opacity: .45; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ink); margin: 6px 0; font-size: 15px; }
  .val { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  #log {
    font-size: 12px; line-height: 1.45; height: 160px; overflow-y: auto; white-space: pre-wrap;
    background: var(--bg); border-radius: 10px; padding: 8px; color: var(--muted);
    font-family: ui-monospace, Menlo, monospace;
  }
  .stopbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  #stopBtn {
    display: block; width: 100%; max-width: 560px; margin: 0 auto;
    font-size: 22px; font-weight: 800; padding: 22px; border-radius: 18px;
    border: none; background: var(--stop); color: #fff; letter-spacing: 2px;
  }
  @media (prefers-reduced-motion: no-preference) { #stopBtn:active { transform: scale(.98); } }
</style>
</head>
<body>

<h1>中继</h1>
<div class="status" aria-live="polite">
  <span><span class="dot" id="dotCloud"></span>云端 <b id="txtCloud">未连接</b></span>
  <span><span class="dot" id="dotBle"></span>玩具 <b id="txtBle">未连接</b></span>
  <span>当前 <b id="txtNow">0 / 0</b></span>
</div>

<section>
  <h2>连接</h2>
  <label for="baseUrl">Railway 公网地址</label>
  <input id="baseUrl" type="url" placeholder="https://xxxx.up.railway.app" autocomplete="off" autocapitalize="off">
  <label for="secret">BRIDGE_SECRET 密码</label>
  <input id="secret" type="password" autocomplete="off">
  <div class="row">
    <button id="cloudBtn" class="primary">连接云端</button>
    <button id="bleBtn" class="primary">连接玩具</button>
  </div>
  <p class="hint">玩具要先开机，并且关掉 Kisstoy App 和 Intiface，否则会被它们占着。</p>
</section>

<section>
  <h2>安全限制</h2>
  <label for="maxLevel">强度上限 <span class="val" id="maxLevelVal">60</span></label>
  <input id="maxLevel" type="range" min="0" max="100" value="60">
  <label for="maxRun">单次最长运行（秒）</label>
  <input id="maxRun" type="number" min="5" max="1800" value="120" inputmode="numeric">
  <p class="hint">AI 发来的强度会被压到上限以内。超过最长运行时间没有新指令就自动停；云端断线超过 10 秒也会自动停。</p>
</section>

<section>
  <h2>AI 指令作用于</h2>
  <label class="check"><input id="useM1" type="checkbox" checked> 马达 1</label>
  <label class="check"><input id="useM2" type="checkbox" checked> 马达 2</label>
  <p class="hint">用下面的手动滑块分别试一下，就知道哪个是吸吮、哪个是震动。</p>
</section>

<section>
  <h2>手动测试</h2>
  <label for="m1">马达 1 <span class="val" id="m1Val">0</span></label>
  <input id="m1" type="range" min="0" max="100" value="0">
  <label for="m2">马达 2 <span class="val" id="m2Val">0</span></label>
  <input id="m2" type="range" min="0" max="100" value="0">
  <div class="row"><button id="testBtn">轻震 2 秒测试</button></div>
</section>

<section>
  <h2>后台保活</h2>
  <label for="audioUrl">保活音频地址（可不填）</label>
  <input id="audioUrl" type="url" placeholder="留空就用内置的静音音频" autocomplete="off" autocapitalize="off">
  <div class="row"><button id="audioBtn">播放保活音频</button></div>
  <p class="hint">切到后台前先点这里。内置静音音频不管用的话，可以填 README 里给的那个音频地址再试。</p>
</section>

<section>
  <h2>日志</h2>
  <div id="log" role="log"></div>
</section>

<div class="stopbar"><button id="stopBtn">紧急停止</button></div>

<script>
(() => {
  // ===== 设备协议：Kisstoy Lost (Sucking) / BLE 名 QCSW / Galaku 协议（取自 Buttplug 开源实现）=====
  const SERVICE = '00001000-0000-1000-8000-00805f9b34fb';
  const TX_CHAR = '00001001-0000-1000-8000-00805f9b34fb';
  const KEY_TAB = [
    [0, 24, 152, 247, 165, 61, 13, 41, 37, 80, 68, 70],
    [0, 69, 110, 106, 111, 120, 32, 83, 45, 49, 46, 55],
    [0, 101, 120, 32, 84, 111, 121, 115, 10, 142, 157, 163],
    [0, 197, 214, 231, 248, 10, 50, 32, 111, 98, 13, 10],
  ];
  function encodePacket(s1, s2) {
    const d = [35, 90, 0, 0, 1, 64, 3, s1, s2, 0, 0];
    d.push(d.reduce((a, b) => a + b, 0));
    const out = [d[0]];
    for (let i = 1; i < d.length; i++) {
      const k = KEY_TAB[out[i - 1] & 3][i];
      out.push((k ^ d[0] ^ d[i]) + k);
    }
    return new Uint8Array(out.map(v => v & 255));
  }

  // ===== 小工具 =====
  const $ = id => document.getElementById(id);
  const logBox = $('log');
  function log(msg) {
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    logBox.textContent += `[${t}] ${msg}\n`;
    const lines = logBox.textContent.split('\n');
    if (lines.length > 300) logBox.textContent = lines.slice(-300).join('\n');
    logBox.scrollTop = logBox.scrollHeight;
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem('relay:' + k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('relay:' + k, v); } catch {} },
  };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, Math.round(Number(v) || 0)));

  // ===== 恢复设置 =====
  $('baseUrl').value = store.get('baseUrl', '');
  $('secret').value = store.get('secret', '');
  $('maxLevel').value = store.get('maxLevel', '60');
  $('maxRun').value = store.get('maxRun', '120');
  $('useM1').checked = store.get('useM1', '1') === '1';
  $('useM2').checked = store.get('useM2', '1') === '1';
  $('audioUrl').value = store.get('audioUrl', '');
  $('maxLevelVal').textContent = $('maxLevel').value;

  ['baseUrl', 'secret', 'maxRun', 'audioUrl'].forEach(id =>
    $(id).addEventListener('change', () => store.set(id, $(id).value.trim())));
  $('maxLevel').addEventListener('input', () => {
    $('maxLevelVal').textContent = $('maxLevel').value;
    store.set('maxLevel', $('maxLevel').value);
    if (cur[0] || cur[1]) setSpeeds(cur[0], cur[1], 'limit'); // 降上限时立即生效
  });
  ['useM1', 'useM2'].forEach(id =>
    $(id).addEventListener('change', () => store.set(id, $(id).checked ? '1' : '0')));

  // ===== 蓝牙 =====
  let bleDevice = null, txChar = null;
  let writeChain = Promise.resolve();
  const cur = [0, 0];
  let runTimer = null, keepTimer = null;

  function setBleStatus(on, text) {
    $('dotBle').classList.toggle('on', on);
    $('txtBle').textContent = text;
  }
  function showNow() { $('txtNow').textContent = `${cur[0]} / ${cur[1]}`; }

  function writePacket(s1, s2) {
    if (!txChar) return Promise.resolve();
    const pkt = encodePacket(s1, s2);
    writeChain = writeChain.then(() =>
      (txChar.writeValueWithoutResponse ? txChar.writeValueWithoutResponse(pkt) : txChar.writeValue(pkt))
    ).catch(e => log('写入失败：' + e.message));
    return writeChain;
  }

  function setSpeeds(a, b, source) {
    const max = clamp($('maxLevel').value, 0, 100);
    cur[0] = Math.min(clamp(a, 0, 100), max);
    cur[1] = Math.min(clamp(b, 0, 100), max);
    showNow();
    $('m1').value = cur[0]; $('m1Val').textContent = cur[0];
    $('m2').value = cur[1]; $('m2Val').textContent = cur[1];
    writePacket(cur[0], cur[1]);

    clearTimeout(runTimer);
    if (cur[0] || cur[1]) {
      const secs = clamp($('maxRun').value, 5, 1800);
      runTimer = setTimeout(() => { log(`已运行 ${secs} 秒没有新指令，自动停止`); stopAll(); }, secs * 1000);
    }
  }

  function stopAll() {
    clearTimeout(runTimer);
    cur[0] = 0; cur[1] = 0;
    showNow();
    $('m1').value = 0; $('m1Val').textContent = 0;
    $('m2').value = 0; $('m2Val').textContent = 0;
    writePacket(0, 0);
    setTimeout(() => writePacket(0, 0), 150); // 发两次，防止丢包
  }

  // 续命：运行中每秒重发一次当前强度
  keepTimer = setInterval(() => { if (txChar && (cur[0] || cur[1])) writePacket(cur[0], cur[1]); }, 1000);

  $('bleBtn').addEventListener('click', async () => {
    if (!navigator.bluetooth) { log('这个浏览器不支持网页蓝牙，请用 Bluefy 打开本页'); return; }
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'QCSW' }, { namePrefix: 'QC' }],
        optionalServices: [SERVICE],
      });
      bleDevice.addEventListener('gattserverdisconnected', () => {
        txChar = null; cur[0] = 0; cur[1] = 0; showNow();
        setBleStatus(false, '已断开');
        log('玩具蓝牙断开了，点「连接玩具」重连');
      });
      setBleStatus(false, '连接中…');
      const server = await bleDevice.gatt.connect();
      const svc = await server.getPrimaryService(SERVICE);
      txChar = await svc.getCharacteristic(TX_CHAR);
      setBleStatus(true, bleDevice.name || '已连接');
      log(`已连接玩具：${bleDevice.name || '未知名称'}`);
      stopAll();
    } catch (e) {
      setBleStatus(false, '未连接');
      log('连接玩具失败：' + e.message);
    }
  });

  // ===== 手动测试 =====
  ['m1', 'm2'].forEach((id, i) => $(id).addEventListener('input', () => {
    const v = [cur[0], cur[1]]; v[i] = Number($(id).value);
    setSpeeds(v[0], v[1], 'manual');
  }));
  $('testBtn').addEventListener('click', () => {
    if (!txChar) { log('先连接玩具'); return; }
    log('测试：两个马达 20%，2 秒');
    setSpeeds(20, 20, 'test');
    setTimeout(stopAll, 2000);
  });

  // ===== 紧急停止 =====
  $('stopBtn').addEventListener('click', () => { stopAll(); log('紧急停止'); });

  // ===== 云端轮询 =====
  let polling = false, pollTimer = null, failSince = null, lastLoggedFail = 0;

  function setCloudStatus(on, text) {
    $('dotCloud').classList.toggle('on', on);
    $('txtCloud').textContent = text;
  }
  function baseUrl() {
    let u = $('baseUrl').value.trim().replace(/\/+$/, '');
    if (u && !/^https?:\/\//.test(u)) u = 'https://' + u;
    return u;
  }

  function handleCommand(cmd) {
    const action = String(cmd.action || '');
    if (action === 'stop') { log('收到指令：停止'); stopAll(); return; }
    if (action === 'intensity') {
      const v = clamp(cmd.value, 0, 100);
      const a = $('useM1').checked ? v : 0;
      const b = $('useM2').checked ? v : 0;
      const max = clamp($('maxLevel').value, 0, 100);
      log(`收到指令：强度 ${v}` + (v > max ? `（压到上限 ${max}）` : ''));
      if (v === 0) stopAll(); else setSpeeds(a, b, 'ai');
      return;
    }
    log(`收到未知指令「${action}」，已忽略`);
  }

  async function pollOnce() {
    if (!polling) return;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(`${baseUrl()}/toy-next?secret=${encodeURIComponent($('secret').value.trim())}`,
        { cache: 'no-store', signal: ctrl.signal });
      if (res.status === 401) {
        log('云端拒绝：密码不对，检查 BRIDGE_SECRET');
        stopPolling(); return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (failSince) log('云端恢复连接');
      failSince = null;
      setCloudStatus(true, '已连接');
      if (data && data.command) handleCommand(data.command);
    } catch (e) {
      const now = Date.now();
      if (!failSince) failSince = now;
      setCloudStatus(false, '连接不稳');
      if (now - lastLoggedFail > 5000) { log('云端请求失败：' + (e.name === 'AbortError' ? '超时' : e.message)); lastLoggedFail = now; }
      if (now - failSince > 10000 && (cur[0] || cur[1])) { log('云端断线超过 10 秒，自动停止'); stopAll(); }
    } finally {
      clearTimeout(to);
      if (polling) pollTimer = setTimeout(pollOnce, 300);
    }
  }

  function stopPolling() {
    polling = false; clearTimeout(pollTimer);
    setCloudStatus(false, '未连接');
    $('cloudBtn').textContent = '连接云端';
    stopAll();
  }

  $('cloudBtn').addEventListener('click', () => {
    if (polling) { stopPolling(); log('已断开云端'); return; }
    if (!baseUrl()) { log('先填 Railway 公网地址'); return; }
    if (!$('secret').value.trim()) { log('先填 BRIDGE_SECRET 密码'); return; }
    store.set('baseUrl', baseUrl()); store.set('secret', $('secret').value.trim());
    polling = true; failSince = null;
    $('cloudBtn').textContent = '断开云端';
    setCloudStatus(false, '连接中…');
    log('开始接收云端指令');
    pollOnce();
  });

  // ===== 后台保活 =====
  let audioEl = null;
  function silentWavUrl() {
    const rate = 8000, n = rate; // 1 秒
    const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  $('audioBtn').addEventListener('click', async () => {
    if (audioEl && !audioEl.paused) {
      audioEl.pause(); $('audioBtn').textContent = '播放保活音频'; log('已停止保活音频'); return;
    }
    const custom = $('audioUrl').value.trim();
    if (!audioEl || audioEl.dataset.src !== custom) {
      audioEl = new Audio(custom || silentWavUrl());
      audioEl.dataset.src = custom;
      audioEl.loop = true; audioEl.setAttribute('playsinline', '');
    }
    try {
      await audioEl.play();
      $('audioBtn').textContent = '停止保活音频';
      log('保活音频播放中' + (custom ? '（自定义地址）' : '（内置静音）'));
    } catch (e) { log('保活音频播放失败：' + e.message); }
  });

  log('页面已就绪。顺序：连接云端 → 连接玩具 → 测试 → 播放保活音频');
})();
</script>
</body>
</html>
